name = "terco"
version = "0.1.0"
license = "MIT"
author = "JorgeG94"
maintainer = "jorgegalvez1694@gmail.com"
copyright = "Copyright 2026, Jorge Luis Galvez Vallejo"
description = "GPU Gaussian integrals in standard Fortran: do concurrent, OpenACC, no CUDA"
homepage = "https://github.com/JorgeG94/terco"

# fpm builds the SHIPPED configuration and only that one: TRC_LMAX=2, the
# committed kernels in src/generated, plus the Rys kernels fpm cannot generate
# itself. Generate those first, then build:
#
#   tools/fpm_generate.sh
#   fpm build --compiler mpifort
#
# Any other angular momentum ceiling needs the CMake build. See
# docs/GENERATORS.md.
#
# The GPU flags are NOT here, because fpm has no way to make them conditional
# on the compiler and they are meaningless to anything but nvfortran. Add them
# on the command line:
#
#   fpm build --compiler mpifort --flag "-stdpar=gpu -acc -gpu=cc70,mem:separate"
#
# Without -stdpar=gpu this compiles to a correct and very slow CPU library.

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
# The definitions CMake always sets (CMakeLists.txt, target_compile_definitions).
macros = ["TRC_LMAX=2", "TRC_FOCK6", "TRC_PERCLASS"]

[library]
source-dir = "src"
# `#include "inc/..."` and the generated .inc files, as CMake's include directories.
include-dir = ["src", "src/generated"]
type = "static"

[build]
auto-executables = false
auto-tests = false
module-naming = false

[install]
library = true

# The `terco` command line program. Under fpm it finds basis sets by path or
# through $TERCO_BASIS_PATH only; the CMake build also installs them.
[[executable]]
name = "terco"
source-dir = "app"
main = "main.F90"


[dependencies]
pic = { git = "https://github.com/JorgeG94/pic", tag = "v0.9.2" }
pic-blas = { git = "https://github.com/JorgeG94/pic-blas", tag = "v0.3.1" }
# pic-mpi's own manifest compiles every backend, and two of them need
# mpi_f08, so under fpm this dependency needs an MPI for the compiler in
# use: `fpm build --compiler mpifort`. The CMake build has a serial backend.
pic-mpi = { git = "https://github.com/JorgeG94/pic-mpi", tag = "v0.6.8" }
json-fortran = { git = "https://github.com/jacobwilliams/json-fortran", tag = "9.3.1" }

[extra.fortitude.check]
select = ["C", "E", "S", "PORT", "OB041"]

# S212 is the warning that a program and a module are in the same file, this would make our tests stupid
# C003 is 'implicit none' missing 'external', this does not always work with other compilers, so we ignore it
# C072 is character '{name}' has assumed size but does not have intent(in), since this is a bit too much
# C071 is assumed-size `a(*)`: the bind(c) dummies need it for C interop, and the kernels use it
# on purpose so the device never walks an array descriptor
ignore = ["C003", "C071", "C072", "S212", "C142", "C183", "C181"]

# src/generated is generator output; CI's generated-sources job already checks it against
# scripts/. Lint the generators' output once they emit clean code.
exclude = ["test/*", "src/generated/*"]
line-length = 132


# Each entry is scoped to the rules that file needs, so anything else in it still fails.
[extra.fortitude.check.per-file-ignores]
# The public header module: re-exporting all of iso_c_binding to callers is its job.
"include/trc_c_interfaces.f90" = ["C121", "C132"]
# cublas/cusolverdn are NVIDIA's modules, used whole under _OPENACC.
"src/core/trc_linalg.F90" = ["C121"]
# Generated by scripts/gen_boys_table.py (the table size) and tools/gen_xc_registry.py
# (long registry lines); fix in the generators with src/generated.
"src/core/trc_boys.F90" = ["C031"]
"src/xc/trc_xc_functional.F90" = ["S001"]
# Vendored as-is.
"src/xc/vendor/*" = ["C031"]
# The kernels keep several assignments per line on purpose.
"src/eri/trc_binkernel.F90" = ["S082"]
# `procedure :: operator => pcm_operator` is valid Fortran the parser rejects.
"src/solvation/trc_pcm.F90" = ["E001", "S082"]
# Default-initialised components of a local derived type, not saved locals.
"src/scf/trc_sap.F90" = ["C081"]
