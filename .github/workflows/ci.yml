name: ci

# WHAT CI CAN AND CANNOT CHECK HERE
#
# terco's reason for existing is GPU code, and no GitHub runner has a GPU. So
# CI cannot measure it and does not try.
#
# What it CAN do is the thing that actually catches regressions: build for the
# host and run the whole validation suite. On the host `do concurrent` is an
# ordinary loop and every OpenACC directive is an inert comment, so the
# integrals must come out identical. A number that depends on the offload
# model is a bug in the offload model, and this is where that shows up.
#
# The GPU build is left to a developer with a card, and to the checks in
# `test/` that report their own tolerances.

on:
  # A branch with an open PR is built once, by its pull_request run. Pushes
  # build only main, which is what landed; anything else can be run by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, at midnight AEDT (13:00 UTC; cron is always UTC, so it is 1am
  # under AEST). This is the only run that includes the tests labelled LONG
  # (`set_tests_properties(... LABELS LONG)` in test/CMakeLists.txt), which
  # pull requests and pushes skip, and it also catches toolchain drift with
  # no code change. Scheduled runs fire only on the default branch.
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

env:
  # Every ctest below appends this: LONG tests run only on the nightly
  # schedule and when the workflow is started by hand.
  # (Written as `not-nightly && '-LE LONG' || ''`: an empty string is falsy
  # in GitHub expressions, so `nightly && '' || '-LE LONG'` would always
  # give '-LE LONG'.)
  CTEST_LONG: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '-LE LONG' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  host-build:
    name: host ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gfortran 15 is the FLOOR, not a preference: `do concurrent`
        # locality specifiers (`local()`, Fortran 2018) landed there, and the
        # kernels use them.
        toolchain:
          - {compiler: gcc, version: 15}
          - {compiler: intel, version: '2025.0'}
          - {compiler: nvidia-hpc, version: 'latest'}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libblas-dev

      # TERCO_ENABLE_GPU=OFF is the whole point of this job: it is the only
      # configuration a runner without a GPU can both compile and validate.
      - name: Configure
        run: >-
          cmake -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTERCO_ENABLE_GPU=OFF
          -S . -B build

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show the failure verbosely
        if: failure()
        run: cmake --build build --verbose --parallel 1

      - name: Validate
        run: >-
          ctest --test-dir build --output-on-failure --parallel 2
          --no-tests=error ${{ env.CTEST_LONG }}

      # How far this compiler's numbers sit from the committed goldens,
      # quantity by quantity (test/goldens/compare_goldens.py --report).
      # Passing tests print nothing, so without this the spread the golden
      # tolerances are set from would only show when something fails.
      - name: Golden spread
        if: always()
        run: python3 test/goldens/compare_goldens.py --report build/test/golden_out

  host-df-lmax3:
    name: host gcc-15 (TERCO_DF_LMAX=3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        id: setup-fortran
        with:
          compiler: gcc
          version: 15

      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libblas-dev

      # No pyscf in CI, ever (test/pyscf_refs/README.md): a live pyscf SCF is
      # a second solver whose own convergence (not terco's) can turn a job
      # red, which is exactly what happened before this job's pyscf
      # comparisons were moved to committed references
      # (test/pyscf_refs/generate.py runs once, offline, on a developer
      # machine with pyscf installed; this job's Fortran checks only ever
      # read the plain-text files it wrote under test/pyscf_refs/). At
      # DF_LMAX=3 those comparisons run FOR REAL, not skipped -- a reference
      # missing at this ceiling is a hard FAIL (pyscf_ref_io.F90's
      # ref_require), not a silent Skipped.

      # DF_LMAX=3 raises gen_df.py's orbital ceiling past the shipped one and
      # its auxiliary ceiling (always one higher) to 4, which is what lets
      # check_df_vs_pyscf run water/cc-pVTZ (f on O) against cc-pVTZ-RI (g on
      # O) instead of skipping (test/check_df_vs_pyscf.F90's own header). Not
      # TERCO_LMAX: that is the separate, much slower host-lmax3 job below --
      # MEASURED, this one builds in well under a PR's patience (all the DF
      # objects it adds took ~138 s on 4 cores locally), so it runs on every
      # PR rather than waiting for a nightly slot.
      - name: Configure
        run: >-
          cmake -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTERCO_ENABLE_GPU=OFF
          -DTERCO_DF_LMAX=3
          -S . -B build

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show the failure verbosely
        if: failure()
        run: cmake --build build --verbose --parallel 1

      - name: Validate
        run: >-
          ctest --test-dir build --output-on-failure --parallel 2
          --no-tests=error ${{ env.CTEST_LONG }}

      # How far this compiler's numbers sit from the committed goldens,
      # quantity by quantity (test/goldens/compare_goldens.py --report).
      # Passing tests print nothing, so without this the spread the golden
      # tolerances are set from would only show when something fails.
      - name: Golden spread
        if: always()
        run: python3 test/goldens/compare_goldens.py --report build/test/golden_out

  host-lmax3:
    name: host gcc-15 (TERCO_LMAX=3)
    runs-on: ubuntu-latest
    # MEASURED: a clean gfortran 15 CPU build at -DTERCO_LMAX=3
    # -DTERCO_DF_LMAX=3 with -j2 (this job's own parallelism, matching a
    # 2-core runner) took 10m26s wall (20m6s user, 4 physical cores locally)
    # -- comfortably under the ~25-minute point past which a PR should not
    # wait on it, so this runs on every PR like every other job here rather
    # than being pushed to a nightly schedule.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        id: setup-fortran
        with:
          compiler: gcc
          version: 15

      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libblas-dev

      # No pyscf in CI, ever (see host-df-lmax3's own comment above and
      # test/pyscf_refs/README.md): every pyscf comparison here reads a
      # committed reference under test/pyscf_refs/ instead, and at
      # TERCO_LMAX=3 the f-shell cases (water/cc-pVTZ, formamide/def2-TZVP)
      # run FOR REAL -- a reference missing at this ceiling is a hard FAIL,
      # not a Skipped.

      # TERCO_LMAX=3 is the four-centre f ceiling (CMakeLists.txt's own
      # option comment); Rys, which it needs, is always built. Paired with
      # TERCO_DF_LMAX=3 for the same reason test/CMakeLists.txt registers
      # check_df_vs_pyscf and the f/g cases together: one job that actually
      # exercises every class the should-fix review asked CI to cover,
      # rather than two jobs each missing half of it.
      - name: Configure
        run: >-
          cmake -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTERCO_ENABLE_GPU=OFF
          -DTERCO_LMAX=3
          -DTERCO_DF_LMAX=3
          -S . -B build

      # The generation stamps (src/CMakeLists.txt, GENERATION STAMPS): a
      # reconfigure with nothing changed must run no generator, and an edited
      # output must be regenerated and restored. This job, because it is the
      # one that generates both blocks (the kernel set and the Rys kernels).
      - name: Reconfigure skips the generators
        run: |
          cmake build | tee reconf.log
          grep -q "kernels for LMAX=3, lexicographic order up to date (stamp" reconf.log
          grep -q "Rys kernels up to date (stamp" reconf.log
          if grep -q "terco: generating" reconf.log; then
            echo "::error::a reconfigure with nothing changed ran a generator"
            exit 1
          fi
          echo '! stale' >> build/generated_rys/trc_rys_kernels.F90
          cmake build | tee reconf2.log
          grep -q "terco: generating Rys kernels" reconf2.log
          if grep -q '! stale' build/generated_rys/trc_rys_kernels.F90; then
            echo "::error::an edited generated file survived the reconfigure"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show the failure verbosely
        if: failure()
        run: cmake --build build --verbose --parallel 1

      - name: Validate
        run: >-
          ctest --test-dir build --output-on-failure --parallel 2
          --no-tests=error ${{ env.CTEST_LONG }}

      # How far this compiler's numbers sit from the committed goldens,
      # quantity by quantity (test/goldens/compare_goldens.py --report).
      # Passing tests print nothing, so without this the spread the golden
      # tolerances are set from would only show when something fails.
      - name: Golden spread
        if: always()
        run: python3 test/goldens/compare_goldens.py --report build/test/golden_out

  fpm-build:
    name: fpm (gcc 15)
    runs-on: ubuntu-latest
    # Off until pic-mpi can be built by fpm without an MPI: its manifest
    # compiles every backend, two of which need mpi_f08, and an MPI built for
    # gfortran 15 is not something a runner has. The gfortran CMake job above
    # covers the compiler; this job only ever checked the shipped manifest.
    # Re-enable by deleting the `if`.
    if: false
    steps:
      - uses: actions/checkout@v4

      # Same floor as host-build: `local()` locality specifiers need 15.
      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        id: setup-fortran
        with:
          compiler: gcc
          version: 15

      # Not fortran-lang/setup-fpm: v5 cannot fetch fpm at all. The release
      # binary is one curl and is pinned, so a bad fpm release cannot turn this
      # job red without a commit here.
      - name: Install fpm
        run: |
          curl -sSL -o "$HOME/fpm" \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x "$HOME/fpm"
          echo "$HOME" >> "$GITHUB_PATH"

      - name: fpm versioning
        run: fpm --version

      # The fpm build exists so that `fpm install terco` works for someone who
      # does not want CMake. It compiles the COMMITTED kernels in
      # `src/generated` plus the Rys kernels tools/fpm_generate.sh writes to
      # src/generated/fpm -- fpm cannot run the generators itself.
      #
      # No GPU flags: without `-stdpar=gpu` this is a correct, slow CPU
      # library, which is exactly what a runner can check.
      - name: Generate the Rys kernels
        run: tools/fpm_generate.sh

      - name: fpm build
        run: fpm build --compiler mpifort --profile release --flag "-ffree-line-length-none"

  generators:
    name: generated sources are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # `src/generated` is committed so that fpm -- which cannot run a code
      # generator -- has something to build. Committed generated code drifts
      # from its generator silently, and a stale generated file in this project
      # is a WRONG NUMBER rather than a build failure: see the stale-include
      # trap in docs/GENERATORS.md. So regenerate and require no diff.
      - name: Regenerate
        run: |
          python3 scripts/gen_perclass.py --lmax 2 --split src/generated
          python3 scripts/gen_1e.py --lmax 2 -o src/generated/trc_1e_kernels.F90
          python3 scripts/gen_1e.py --lmax 2 --multipole src/generated/trc_mult_kernels.F90
          python3 scripts/gen_1e.py --lmax 2 --pcm src/generated/trc_pcm_kernels.F90
          python3 scripts/gen_1e.py --lmax 2 --deriv src/generated/trc_1e_grad_kernels.F90
          # The shipped DF set: d orbitals, g auxiliary (def2-universal-jkfit),
          # and the same unroll threshold as CMake's TERCO_RYS_UNROLL_MAX.
          python3 scripts/gen_df.py --lmax 2 --lmax-aux 4 --unroll-max-comp 81 --split src/generated
          # Their nuclear derivatives (the --df gradient), same ceilings and threshold.
          python3 scripts/gen_df_grad.py --lmax 2 --lmax-aux 4 --unroll-max-comp 81 --split src/generated

      - name: Require no diff
        run: |
          if ! git diff --quiet -- src/generated; then
            echo "::error::src/generated is out of date with scripts/."
            echo "Run the commands in the 'Regenerate' step and commit the result."
            git diff --stat -- src/generated
            exit 1
          fi

  rys-generators:
    name: Rys root tables are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # scripts/gen_rys_roots.py is the one generator in this project that
      # needs mpmath -- high-precision quadrature for the Chebyshev fit, at
      # generation time only, never on the device. The install lands in the
      # SAME commit as the generator, pinned, so a library that changes its
      # last digit shows up here rather than defeating "regenerating
      # reproduces the committed files" silently.
      - name: Install mpmath
        run: pip install mpmath==1.3.0

      - name: Regenerate
        run: |
          python3 scripts/gen_rys_roots.py -n 1 -o src/generated/rys/trc_rys_table1.F90
          python3 scripts/gen_rys_roots.py -n 2 -o src/generated/rys/trc_rys_table2.F90
          python3 scripts/gen_rys_roots.py -n 3 -o src/generated/rys/trc_rys_table3.F90
          python3 scripts/gen_rys_roots.py -n 4 -o src/generated/rys/trc_rys_table4.F90
          python3 scripts/gen_rys_roots.py -n 5 -o src/generated/rys/trc_rys_table5.F90
          python3 scripts/gen_rys_roots.py -n 6 -o src/generated/rys/trc_rys_table6.F90
          python3 scripts/gen_rys_roots.py -n 7 -o src/generated/rys/trc_rys_table7.F90
          python3 scripts/gen_rys_roots.py -n 8 -o src/generated/rys/trc_rys_table8.F90
          python3 scripts/gen_rys_roots.py -n 9 -o src/generated/rys/trc_rys_table9.F90

      - name: Require no diff
        run: |
          if ! git diff --quiet -- src/generated/rys; then
            echo "::error::src/generated/rys is out of date with scripts/gen_rys_roots.py."
            echo "Run the commands in the 'Regenerate' step and commit the result."
            git diff --stat -- src/generated/rys
            exit 1
          fi

  openmp-port:
    name: OpenACC to OpenMP conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libblas-dev

      # A `do concurrent` that assigns a scalar without naming it is correct
      # as written -- the standard privatises it -- and becomes a data race
      # the moment the construct is rewritten as `!$omp parallel do`, whose
      # default is shared. That is invisible until conversion, so it is
      # checked before conversion.
      - name: Locality lint
        run: python3 tools/dc_locality_lint.py src

      - name: Converter unit tests
        run: |
          pip install pytest
          python3 -m pytest tools/test_acc_to_omp.py -q

      # The conversion has to keep producing something that COMPILES and gives
      # the same answers, not merely something that parses. Converting to the
      # host OpenMP target and running the same validation is what makes that
      # a real check rather than a syntax exercise.
      # The FULL port, in the order it has to happen:
      #
      #   1. dc_to_omp rewrites `do concurrent` as OpenMP worksharing and
      #      strips `pure` from every procedure that ends up holding a
      #      worksharing directive or an atomic -- cascading to their pure
      #      callers, since a pure procedure may only call pure ones.
      #   2. acc_to_omp then translates the data directives AND the atomics,
      #      which is only legal because step 1 removed the purity that
      #      forbade them.
      #
      # Reversing the two produces source that does not compile.
      - name: Convert to OpenMP and validate
        run: |
          python3 tools/dc_to_omp.py --target cpu --write src
          python3 tools/acc_to_omp.py --target cpu --translate-atomics --write src
          git diff --stat -- src | tail -1
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DTERCO_ENABLE_GPU=OFF \
                -DCMAKE_Fortran_FLAGS=-fopenmp -S . -B build-omp
          cmake --build build-omp --parallel 2
          # THREADS ARE THE POINT. The conversion turns constructs whose
          # locality the standard guaranteed into ones where OpenMP's default
          # is shared, so the failure mode is a race -- and a race is invisible
          # on one thread. Running this suite single-threaded would have passed
          # while the enumerated Fock digestion was silently wrong.
          OMP_NUM_THREADS=4 ctest --test-dir build-omp --output-on-failure \
            --no-tests=error ${{ env.CTEST_LONG }}

      - name: Golden spread
        if: always()
        run: python3 test/goldens/compare_goldens.py --report build-omp/test/golden_out

  fortitude:
    name: fortitude lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Rules, excludes and per-file ignores live in fpm.toml's
      # [extra.fortitude.check]. Pinned, so a new fortitude release cannot
      # turn main red with no code change; bump it on purpose.
      - name: Install fortitude
        run: pip install fortitude-lint==0.9.2

      - name: fortitude check
        run: fortitude check --output-format github
